plugins { id 'com.android.application' }

def releaseKeystorePath = System.getenv('SOHEIL_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('SOHEIL_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('SOHEIL_KEY_ALIAS')
def releaseKeyPassword = System.getenv('SOHEIL_KEY_PASSWORD')

android {
    namespace 'com.soheil.lifeos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.soheil.lifeos'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.1-security'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        debug {
            // Security-test APKs are non-debuggable but still use test signing.
            debuggable false
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystorePath) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
}
