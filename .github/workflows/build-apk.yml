name: Build SOHEIL Security Test APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Security invariant gate
        run: bash security/security_gate.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build non-debuggable security-test APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify and package APK
        run: |
          apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk SOHEIL-v0.3.1-security-test.apk
          sha256sum SOHEIL-v0.3.1-security-test.apk > SOHEIL-v0.3.1-security-test.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SOHEIL-v0.3.1-security-test
          path: |
            SOHEIL-v0.3.1-security-test.apk
            SOHEIL-v0.3.1-security-test.sha256
          retention-days: 14
